[package]
edition = "2024"
rust-version = "1.85"
name = "rp-hub75"
version = "0.1.1"
authors = ["liebman <liebman@zod.com>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A HUB75 LED matrix driver for RP2040 and RP2350 (Pimoroni Interstate 75 W)"
