[dependencies.embedded-graphics]
version = "0.8.2"

[dependencies.hub75-framebuffer]
version = "0.13.0"
features = ["interstate75"]

[dependencies.pio]
version = "0.3"

[dependencies.portable-atomic]
version = "1"
default-features = false

[dependencies.static_cell]
version = "2.1"

[target.'cfg(not(target_os = "none"))'.dependencies.rp235x-hal]
version = "0.4.0"
