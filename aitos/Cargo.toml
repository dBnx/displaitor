[package]
name = "aitos"
version = "0.2.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "aitos"
path = "src/main.rs"
test = false
bench = false
required-features = ["firmware"]

[features]
default = ["ram-code"]
firmware = []
# Flash bootstrap copies executable code and vectors to SRAM; media remains XIP.
ram-code = []
# SWD-readable timing counters; absent from normal firmware.
profiling = ["firmware"]

[dependencies]
displaitor = { path = "../displaitor" }
qoa_decoder = { path = "../qoa_decoder" }
embedded-graphics.workspace = true

[target.'cfg(all(target_arch = "arm", target_os = "none"))'.dependencies]
cortex-m = "0.7.9"
cortex-m-rt = "0.7.7"
critical-section = "1.2.0"
defmt = "1.2.0"
defmt-rtt = { version = "1.3.1", features = ["disable-blocking-mode"] }
embedded-hal = "1.0.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
embassy-rp = { version = "0.10.0", features = ["rp2040", "time-driver", "critical-section-impl", "rom-func-cache", "executor-thread", "executor-interrupt", "boot2-w25q080", "unstable-pac"] }
embassy-executor = "0.10.0"
embassy-futures = "0.1.2"
embassy-sync = "0.8.0"
embassy-time = "0.5.1"
embassy-usb = { version = "0.6.0", default-features = false }
rp-hub75 = { version = "0.1.1", features = ["embassy-rp2040"] }
static_cell = "2.1.1"
portable-atomic = { version = "1.15.0", features = ["critical-section"] }

[target.'cfg(not(all(target_arch = "arm", target_os = "none")))'.dev-dependencies]
critical-section = { version = "1.2.0", features = ["std"] }
embassy-sync = "0.8.0"
embassy-futures = "0.1.2"
