[package]
name = "simulaitor"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["sdl"]
sdl = ["dep:sdl2"]

[dependencies]
aitos = { path = "../aitos" }
displaitor = { path = "../displaitor" }
embedded-graphics.workspace = true
sdl2 = { version = "0.38.0", optional = true, features = ["use-pkgconfig"] }
